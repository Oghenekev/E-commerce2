<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to get amazing prices</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="login-background">
     <h2>Welcome to Antique fitness</h2>
      <div class="container">
        <div class="form-box">
            <form action="" name="formFill" onsubmit="return validation()">
                <h2>Register</h2>
                <p id="result"></p>
                <div class="input-box">
                    <input type="text" name="Username" placeholder="Enter your Username">
                </div>
                <div class="input-box">
                    <input type="email" name="Email" placeholder="Enter your Email">
                </div>
                <div class="input-box">
                    <input type="password" name="Password" placeholder="Enter your password">
                </div>
                <div class="input-box">
                    <input type="password" name="Cpassword" placeholder="Confirm your password">
                </div>
                <div class="input-box2">
                    <input type="submit" value="register" class="btn_12" onclick="validation()">
                </div>

                <div class="group">
                    <span><a href="">Forgot Password</a></span>
                    <span><a href="">Login</a></span>
                </div>

    
            </form>
        </div>
        <div class="popup" id="popup">
            <h2>Thank You</h2>
            <p>Registeration successful</p>
            <a href="index.html"><button>OK</button></a>
        </div>
    </div>
   </div>
    <script src="script.js"></script> 
</body>
</html>
